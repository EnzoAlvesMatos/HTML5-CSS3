<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&" />
    <link rel="stylesheet" href="estilo/style.css">
    <link rel="stylesheet" href="estilo/media-query.css">
</head>
<body>
    <main>
        <section id="login">
          <div id="imagem">
          </div>
          <div id="formulario">
            <h1>Login</h1>
            <p>Bem Vindo ao Site por favor preencher o formulário</p>
            <form method="post" autocomplete="on">
                <div class="campo">
                <i class="material-symbols-outlined">
                person
                </i>

                <input type="text" name="nome" id="nome" required placeholder="Ex: Alexandre  Alves Souza" maxlength="200" minlength="10" autocomplete="name">
                     <label for="nome">Nome: </label>
                     </div>
                     <div class="campo">
                <i class="material-symbols-outlined">
                mark_email_unread
                </i>

                <input type="email" name="email" id="email" required maxlength="200" minlength="15" placeholder="Ex: alexandrealvessouza0708@gmail.com" autocomplete="email">
                <label for="email">Email: </label>
                </div>
                <div class="campo">
                <i class="material-symbols-outlined">
                lock
                </i>
                <input type="password" name="senha" id="senha" required maxlength="12" minlength="6" autocomplete="new-password" placeholder="Ex:alex09@">
                 <label for="senha">Senha: </label>
                </div>
                <input type="submit" value="Envir">

                <a href="#">Esqueci senha</a>
            </form>
          </div>
        </section>
    </main>
</body>
</html>
